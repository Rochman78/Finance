name: Mollie → PennyLane (nightly)

on:
  schedule:
    - cron: '0 1 * * *'   # tous les jours à 1h00 UTC
  workflow_dispatch:        # déclenchement manuel possible

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mollie-pennylane

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mollie-pennylane/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run Mollie → PennyLane (7 boutiques)
        env:
          DATABASE_URL: ${{ secrets.MOLLIE_DATABASE_URL }}
          PENNYLANE_API_KEY: ${{ secrets.PENNYLANE_API_KEY }}
          MODE_TEST: 'false'
          # LFC
          MOLLIE_API_KEY_LFC: ${{ secrets.MOLLIE_API_KEY_LFC }}
          SHOPIFY_ACCESS_TOKEN_LFC: ${{ secrets.SHOPIFY_ACCESS_TOKEN_LFC }}
          # HET
          MOLLIE_API_KEY_HET: ${{ secrets.MOLLIE_API_KEY_HET }}
          SHOPIFY_ACCESS_TOKEN_HET: ${{ secrets.SHOPIFY_ACCESS_TOKEN_HET }}
          # TAR
          MOLLIE_API_KEY_TAR: ${{ secrets.MOLLIE_API_KEY_TAR }}
          SHOPIFY_ACCESS_TOKEN_TAR: ${{ secrets.SHOPIFY_ACCESS_TOKEN_TAR }}
          # RED
          MOLLIE_API_KEY_RED: ${{ secrets.MOLLIE_API_KEY_RED }}
          SHOPIFY_ACCESS_TOKEN_RED: ${{ secrets.SHOPIFY_ACCESS_TOKEN_RED }}
          # COCO
          MOLLIE_API_KEY_COCO: ${{ secrets.MOLLIE_API_KEY_COCO }}
          SHOPIFY_ACCESS_TOKEN_COCO: ${{ secrets.SHOPIFY_ACCESS_TOKEN_COCO }}
          # LOV
          MOLLIE_API_KEY_LOV: ${{ secrets.MOLLIE_API_KEY_LOV }}
          SHOPIFY_ACCESS_TOKEN_LOV: ${{ secrets.SHOPIFY_ACCESS_TOKEN_LOV }}
          # RETE
          MOLLIE_API_KEY_RETE: ${{ secrets.MOLLIE_API_KEY_RETE }}
          SHOPIFY_ACCESS_TOKEN_RETE: ${{ secrets.SHOPIFY_ACCESS_TOKEN_RETE }}
        run: node index.js
