name: Mollie → PennyLane (nightly)

on:
  schedule:
    - cron: '0 1 * * *'   # tous les jours à 1h00 UTC
  workflow_dispatch:        # déclenchement manuel possible

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mollie-pennylane

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mollie-pennylane/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run Mollie → PennyLane
        env:
          DATABASE_URL: ${{ secrets.MOLLIE_DATABASE_URL }}
          MOLLIE_API_KEY: ${{ secrets.MOLLIE_API_KEY }}
          SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          PENNYLANE_API_KEY: ${{ secrets.PENNYLANE_API_KEY }}
          MODE_TEST: 'false'
          RUN_ONCE: 'true'
        run: node index.js
