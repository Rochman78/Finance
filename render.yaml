services:
  - type: cron
    name: shopify-pennylane
    runtime: python
    schedule: "0 1 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python shopify_pennylane.py --cron
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zephyr_db_z3av
          property: connectionString
      - key: PENNYLANE_TOKEN
        sync: false
      - key: SHOPIFY_SECRET_LFC
        sync: false
      - key: SHOPIFY_SECRET_RED
        sync: false
      - key: SHOPIFY_SECRET_HET
        sync: false
      - key: SHOPIFY_SECRET_MTC
        sync: false
      - key: SHOPIFY_SECRET_MO
        sync: false
      - key: SHOPIFY_SECRET_RETE
        sync: false
      - key: SHOPIFY_SECRET_TZ
        sync: false
      - key: SHOPIFY_SECRET_LVO
        sync: false
      - key: SHOPIFY_SECRET_UNIV
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
